name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt check
        if: runner.os != 'Windows'
        run: |
          # 只检查 git 跟踪的 .go 文件，避免扫到 .contextloom/ 等运行时/忽略目录
          # 中的非源码 .go 文件（内容不保证 gofmt 合规，会导致 CI 假红）
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race -count=1 ./...
